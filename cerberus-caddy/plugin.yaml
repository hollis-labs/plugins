schema_version: "1"
id: caddy
version: 0.1.0
protocol: plugin-sdk/subprocess
runtime: subprocess
entrypoint:
    command: bin/cerberus-caddy-plugin
cerberus:
    connector:
        api_version: cerberus.connector/v1
        kind: Connector
        id: caddy
        version: 0.1.0
        resource_types:
            - caddy.server
        capabilities:
            can_create: false
            can_destroy: false
            can_build: false
            can_logs: false
            can_health: false
        operations:
            - name: reload
              description: Reloads the Caddy server configuration without downtime.
              examples:
                - cerberus connectors exec caddy reload --ack
              input_schema:
                additionalProperties: false
                properties:
                    config_path:
                        description: Path to the Caddyfile (optional).
                        type: string
                type: object
              effect: write
              reversible: true
              target:
                kind: caddy.server
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                type: string
              destructive: true
              requires_ack: true
            - name: validate
              description: Validates a Caddyfile for syntax errors.
              examples:
                - cerberus connectors exec caddy validate
              input_schema:
                additionalProperties: false
                properties:
                    config_path:
                        description: Path to the Caddyfile (optional).
                        type: string
                type: object
              effect: read
              target:
                kind: caddy.server
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                type: string
    host:
        min_contract: 1
        max_contract: 1
    surfaces:
        mcp:
            - reload
            - validate
