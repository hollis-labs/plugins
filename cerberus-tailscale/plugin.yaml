schema_version: "1"
id: tailscale
version: 0.1.0
protocol: plugin-sdk/subprocess
runtime: subprocess
entrypoint:
    command: bin/cerberus-tailscale-plugin
cerberus:
    connector:
        api_version: cerberus.connector/v1
        kind: Connector
        id: tailscale
        version: 0.1.0
        resource_types:
            - tailscale.tailnet
        capabilities:
            can_create: false
            can_destroy: false
            can_build: false
            can_logs: false
            can_health: false
        operations:
            - name: status
              description: Check Tailscale connection status.
              examples:
                - cerberus connectors exec tailscale status
              input_schema:
                additionalProperties: false
                properties: {}
                type: object
              effect: read
              target:
                kind: tailscale.tailnet
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                type: string
            - name: up
              description: Bring the tailnet connection up.
              examples:
                - cerberus connectors exec tailscale up --ack
              input_schema:
                additionalProperties: false
                properties: {}
                type: object
              effect: write
              reversible: true
              target:
                kind: tailscale.tailnet
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                type: string
              destructive: true
              requires_ack: true
            - name: down
              description: Bring the tailnet connection down.
              examples:
                - cerberus connectors exec tailscale down --ack
              input_schema:
                additionalProperties: false
                properties: {}
                type: object
              effect: write
              reversible: true
              target:
                kind: tailscale.tailnet
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                type: string
              destructive: true
              requires_ack: true
            - name: serve
              description: Expose a local port to the tailnet or internet (funnel).
              examples:
                - cerberus connectors exec tailscale serve --arg port=8080 --ack
              input_schema:
                additionalProperties: false
                properties:
                    funnel:
                        description: Whether to expose to the public internet using funnel.
                        type: boolean
                    port:
                        description: Port to serve (e.g., 8080).
                        type: string
                required:
                    - port
                type: object
              effect: write
              reversible: true
              target:
                kind: tailscale.tailnet
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                type: string
              destructive: true
              requires_ack: true
    host:
        min_contract: 1
        max_contract: 1
    surfaces:
        mcp:
            - status
            - up
            - down
            - serve
