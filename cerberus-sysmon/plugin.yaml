schema_version: "1"
id: sysmon
version: 0.2.0
protocol: plugin-sdk/subprocess
runtime: subprocess
entrypoint:
    command: bin/cerberus-sysmon-plugin
cerberus:
    connector:
        api_version: cerberus.connector/v1
        kind: Connector
        id: sysmon
        version: 0.2.0
        resource_types:
            - sysmon.host
        capabilities:
            can_create: false
            can_destroy: false
            can_build: false
            can_logs: false
            can_health: false
        operations:
            - name: cpu
              description: CPU model, logical cores, load averages and usage.
              examples:
                - cerberus connectors exec sysmon cpu
              input_schema:
                additionalProperties: false
                properties: {}
                type: object
              effect: read
              target:
                kind: sysmon.host
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                properties:
                    model:
                        type: string
                        x-cerberus-label:
                            - untrusted
                type: object
            - name: memory
              description: 'Memory and swap in bytes: total, free, available, used.'
              examples:
                - cerberus connectors exec sysmon memory
              input_schema:
                additionalProperties: false
                properties: {}
                type: object
              effect: read
              target:
                kind: sysmon.host
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                type: object
            - name: disk
              description: Filesystem usage in bytes for the mount holding a path.
              examples:
                - cerberus connectors exec sysmon disk --arg path=/
              input_schema:
                additionalProperties: false
                properties:
                    path:
                        description: 'Path to get disk usage for (default: /).'
                        type: string
                type: object
              effect: read
              target:
                kind: sysmon.host
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                properties:
                    mounts:
                        items:
                            properties:
                                device:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                fs_type:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                mount:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                            type: object
                        type: array
                type: object
            - name: host
              description: Hostname, OS, architecture, kernel and uptime.
              examples:
                - cerberus connectors exec sysmon host
              input_schema:
                additionalProperties: false
                properties: {}
                type: object
              effect: read
              target:
                kind: sysmon.host
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                properties:
                    hostname:
                        type: string
                        x-cerberus-label:
                            - untrusted
                    kernel:
                        type: string
                        x-cerberus-label:
                            - untrusted
                    os_version:
                        type: string
                        x-cerberus-label:
                            - untrusted
                type: object
            - name: host_report
              description: 'One report: host identity, CPU, memory, every real mount, GPUs (empty list when none) and warnings for sections that could not be read.'
              examples:
                - cerberus connectors exec sysmon host_report
              input_schema:
                additionalProperties: false
                properties: {}
                type: object
              effect: read
              target:
                kind: sysmon.host
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                properties:
                    cpu:
                        properties:
                            model:
                                type: string
                                x-cerberus-label:
                                    - untrusted
                        type: object
                    disks:
                        items:
                            properties:
                                device:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                fs_type:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                mount:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                            type: object
                        type: array
                    gpus:
                        items:
                            properties:
                                driver:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                model:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                            type: object
                        type: array
                    host:
                        properties:
                            hostname:
                                type: string
                                x-cerberus-label:
                                    - untrusted
                            kernel:
                                type: string
                                x-cerberus-label:
                                    - untrusted
                            os_version:
                                type: string
                                x-cerberus-label:
                                    - untrusted
                        type: object
                type: object
    host:
        min_contract: 1
        max_contract: 1
    surfaces:
        mcp:
            - cpu
            - memory
            - disk
            - host
            - host_report
