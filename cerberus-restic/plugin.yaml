schema_version: "1"
id: restic
version: 0.1.0
protocol: plugin-sdk/subprocess
runtime: subprocess
entrypoint:
    command: bin/cerberus-restic-plugin
cerberus:
    connector:
        api_version: cerberus.connector/v1
        kind: Connector
        id: restic
        version: 0.1.0
        resource_types:
            - restic.repository
        capabilities:
            can_create: false
            can_destroy: false
            can_build: false
            can_logs: false
            can_health: false
        config:
            secrets:
                - name: RESTIC_PASSWORD
                  description: Password for the restic repository
                  env: RESTIC_PASSWORD
        operations:
            - name: init
              description: Initialize a restic repository.
              examples:
                - cerberus connectors exec restic init --arg repo=~/dev/backups/restic-repo --ack
              input_schema:
                additionalProperties: false
                properties:
                    repo:
                        description: The repository path or URL.
                        type: string
                required:
                    - repo
                type: object
              effect: write
              target:
                kind: restic.repository
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                type: string
              destructive: true
              requires_ack: true
            - name: backup
              description: Backup a path to the repository.
              examples:
                - cerberus connectors exec restic backup --arg repo=~/dev/backups/restic-repo --arg path=/my/data --ack
              input_schema:
                additionalProperties: false
                properties:
                    path:
                        description: The local path to backup.
                        type: string
                    repo:
                        description: The repository path or URL.
                        type: string
                required:
                    - repo
                    - path
                type: object
              effect: write
              reversible: true
              target:
                kind: restic.repository
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                type: string
              destructive: true
              requires_ack: true
            - name: snapshots
              description: List snapshots in the repository.
              examples:
                - cerberus connectors exec restic snapshots --arg repo=~/dev/backups/restic-repo
              input_schema:
                additionalProperties: false
                properties:
                    repo:
                        description: The repository path or URL.
                        type: string
                required:
                    - repo
                type: object
              effect: read
              target:
                kind: restic.repository
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                type: string
            - name: restore
              description: Restore a snapshot.
              examples:
                - cerberus connectors exec restic restore --arg repo=~/dev/backups/restic-repo --arg snapshot=latest --arg target=/restore/path --ack
              input_schema:
                additionalProperties: false
                properties:
                    repo:
                        description: The repository path or URL.
                        type: string
                    snapshot:
                        description: Snapshot ID or 'latest'.
                        type: string
                    target:
                        description: Path to restore to.
                        type: string
                required:
                    - repo
                    - snapshot
                    - target
                type: object
              effect: write
              target:
                kind: restic.repository
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                type: string
              destructive: true
              requires_ack: true
    host:
        min_contract: 1
        max_contract: 1
    surfaces:
        mcp:
            - init
            - backup
            - snapshots
            - restore
