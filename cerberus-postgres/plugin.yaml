schema_version: "1"
id: postgres
version: 0.1.0
protocol: plugin-sdk/subprocess
runtime: subprocess
entrypoint:
    command: bin/cerberus-postgres-plugin
cerberus:
    connector:
        api_version: cerberus.connector/v1
        kind: Connector
        id: postgres
        version: 0.1.0
        resource_types:
            - server
        capabilities:
            can_create: false
            can_destroy: false
            can_build: false
            can_logs: false
            can_health: false
        config:
            fields:
                - name: cluster
                  type: string
                  description: Operator-defined cluster identity; calls must match it.
                - name: host
                  type: string
                  description: PostgreSQL DNS hostname (TLS verify-full), or absolute Unix socket directory.
                - name: port
                  type: string
                  description: PostgreSQL port, 1..65535.
                - name: user
                  type: string
                  description: Catalog reader username. No password or DSN in this field.
                - name: database
                  type: string
                  description: Maintenance database for catalog reads.
                - name: ca_file
                  type: string
                  description: Optional PEM trust roots for TLS; system trust otherwise.
            secrets:
                - name: password
                  description: Declared PostgreSQL catalog-reader credential, supplied privately by the host.
                  required: true
        operations:
            - name: inspect
              description: Read bounded cluster metadata only; never application rows or password hashes.
              input_schema:
                additionalProperties: false
                properties:
                    cluster:
                        description: Configured cluster identity; no ad-hoc endpoints.
                        type: string
                required:
                    - cluster
                type: object
              effect: read
              target:
                kind: postgres.cluster
                from:
                    - cluster
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                properties:
                    databases:
                        items:
                            properties:
                                name:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                owner:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                            type: object
                        type: array
                    roles:
                        items:
                            properties:
                                name:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                            type: object
                        type: array
                type: object
            - name: plan_app
              description: Preview app isolation, role split, credential requirements and blockers. Does not provision or generate credentials.
              input_schema:
                additionalProperties: false
                properties:
                    app:
                        description: Lowercase app slug, max 20 characters.
                        type: string
                    cluster:
                        description: Configured cluster identity; no ad-hoc endpoints.
                        type: string
                    environment:
                        description: Lowercase environment slug, max 12 characters.
                        type: string
                    vector:
                        description: Request pgvector for the new app database.
                        type: boolean
                required:
                    - cluster
                    - app
                    - environment
                type: object
              effect: read
              target:
                kind: postgres.cluster
                from:
                    - cluster
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                properties:
                    blockers:
                        items:
                            type: string
                            x-cerberus-label:
                                - untrusted
                        type: array
                type: object
    host:
        min_contract: 1
        max_contract: 1
    surfaces:
        mcp:
            - inspect
            - plan_app
