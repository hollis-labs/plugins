schema_version: "1"
id: postgres
version: 0.3.0
protocol: plugin-sdk/subprocess
runtime: subprocess
entrypoint:
    command: bin/cerberus-postgres-plugin
capabilities:
    - name: credential_issuance_v1
      reason: ""
      optional: false
      metadata: []
cerberus:
    connector:
        api_version: cerberus.connector/v1
        kind: Connector
        id: postgres
        version: 0.3.0
        resource_types:
            - server
        capabilities:
            can_create: false
            can_destroy: false
            can_build: false
            can_logs: false
            can_health: false
        config:
            fields:
                - name: cluster
                  type: string
                  description: Operator-defined cluster identity; calls must match it.
                - name: host
                  type: string
                  description: PostgreSQL DNS hostname (TLS verify-full), or absolute Unix socket directory.
                - name: port
                  type: string
                  description: PostgreSQL port, 1..65535.
                - name: user
                  type: string
                  description: Catalog reader username. No password or DSN in this field.
                - name: admin_user
                  type: string
                  description: Dedicated write-side superuser; admin_password must be bound only to the write process.
                - name: database
                  type: string
                  description: Maintenance database for catalog reads.
                - name: ca_file
                  type: string
                  description: Optional PEM trust roots for TLS; system trust otherwise.
            secrets:
                - name: password
                  description: Declared PostgreSQL catalog-reader credential, supplied privately by the host.
                  required: true
                - name: admin_password
                  description: Dedicated provisioner credential. Bind only in connector-secrets.yaml write; never in read or common credentials.
                  required: true
        operations:
            - name: inspect
              description: Read bounded cluster metadata only; never application rows or password hashes.
              input_schema:
                additionalProperties: false
                properties:
                    cluster:
                        description: Configured cluster identity; no ad-hoc endpoints.
                        type: string
                required:
                    - cluster
                type: object
              effect: read
              target:
                kind: postgres.cluster
                from:
                    - cluster
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                properties:
                    databases:
                        items:
                            properties:
                                name:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                owner:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                            type: object
                        type: array
                    roles:
                        items:
                            properties:
                                name:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                            type: object
                        type: array
                type: object
            - name: plan_app
              description: Preview app isolation, role split, credential requirements and blockers. Does not provision or generate credentials.
              input_schema:
                additionalProperties: false
                properties:
                    app:
                        description: Lowercase app slug, max 20 characters.
                        type: string
                    cluster:
                        description: Configured cluster identity; no ad-hoc endpoints.
                        type: string
                    environment:
                        description: Lowercase environment slug, max 12 characters.
                        type: string
                    vector:
                        description: Request pgvector for the new app database.
                        type: boolean
                required:
                    - cluster
                    - app
                    - environment
                type: object
              effect: read
              target:
                kind: postgres.cluster
                from:
                    - cluster
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                properties:
                    blockers:
                        items:
                            type: string
                            x-cerberus-label:
                                - untrusted
                        type: array
                type: object
            - name: provision_app
              description: Provision a new private app database and separate migration/runtime logins. Refuses adoption and existing PUBLIC CONNECT. Host persists credentials first; return references only.
              input_schema:
                additionalProperties: false
                properties:
                    app:
                        description: Lowercase app slug, max 20 characters.
                        type: string
                    cluster:
                        description: Configured cluster identity; no ad-hoc endpoints.
                        type: string
                    environment:
                        description: Lowercase environment slug, max 12 characters.
                        type: string
                    expected_plan:
                        description: Lifecycle plan_digest from this operation's dry-run; required for execution.
                        type: string
                    issuance_id:
                        description: Fresh 32-character lowercase hex ID; host durably refuses reuse.
                        type: string
                    vector:
                        description: Request pgvector for the new app database.
                        type: boolean
                required:
                    - cluster
                    - app
                    - environment
                    - issuance_id
                type: object
              effect: admin
              target:
                kind: postgres.cluster
                from:
                    - cluster
              preview: plugin
              output: structured
              cost: none
              local_fs: writes
              output_schema:
                oneOf:
                    - properties:
                        adoption_inventory:
                            properties:
                                blockers:
                                    items:
                                        type: string
                                        x-cerberus-label:
                                            - untrusted
                                    type: array
                                database_acl:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                database_owner:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                relations:
                                    items:
                                        properties:
                                            acl:
                                                type: string
                                                x-cerberus-label:
                                                    - untrusted
                                            name:
                                                type: string
                                                x-cerberus-label:
                                                    - untrusted
                                            owner:
                                                type: string
                                                x-cerberus-label:
                                                    - untrusted
                                        type: object
                                    type: array
                                schema_acl:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                schema_owner:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                            type: object
                        app:
                            properties:
                                blockers:
                                    items:
                                        type: string
                                        x-cerberus-label:
                                            - untrusted
                                    type: array
                            type: object
                        blockers:
                            items:
                                type: string
                                x-cerberus-label:
                                    - untrusted
                            type: array
                      type: object
                    - type: object
              issued_secrets:
                - migration_password
                - runtime_password
              destructive: true
              supports_dry: true
              requires_ack: true
            - name: adopt_app
              description: Adopt an existing dedicated database with an explicit table privilege mapping; preserve data and names. Refuse unsupported objects and stale plans. Host persists credentials before transactional ownership/grant changes and activation.
              input_schema:
                additionalProperties: false
                properties:
                    adoption:
                        additionalProperties: false
                        properties:
                            database:
                                description: Existing dedicated database; its name is preserved.
                                type: string
                            legacy_owner:
                                description: Existing non-administrative owner; preserved for a separate consumer cutover.
                                type: string
                            schema:
                                description: Existing application schema, including public; its name is preserved.
                                type: string
                            tables:
                                items:
                                    additionalProperties: false
                                    properties:
                                        access:
                                            enum:
                                                - read
                                                - read_write
                                            type: string
                                        name:
                                            description: Existing ordinary table name.
                                            type: string
                                    required:
                                        - name
                                        - access
                                    type: object
                                maxItems: 32
                                minItems: 1
                                type: array
                        required:
                            - database
                            - schema
                            - legacy_owner
                            - tables
                        type: object
                    app:
                        description: Lowercase app slug, max 20 characters.
                        type: string
                    cluster:
                        description: Configured cluster identity; no ad-hoc endpoints.
                        type: string
                    environment:
                        description: Lowercase environment slug, max 12 characters.
                        type: string
                    expected_plan:
                        description: Lifecycle plan_digest from this operation's dry-run; required for execution.
                        type: string
                    issuance_id:
                        description: Fresh 32-character lowercase hex ID; host durably refuses reuse.
                        type: string
                required:
                    - cluster
                    - app
                    - environment
                    - adoption
                    - issuance_id
                type: object
              effect: admin
              target:
                kind: postgres.cluster
                from:
                    - cluster
              preview: plugin
              output: structured
              cost: none
              local_fs: writes
              output_schema:
                oneOf:
                    - properties:
                        adoption_inventory:
                            properties:
                                blockers:
                                    items:
                                        type: string
                                        x-cerberus-label:
                                            - untrusted
                                    type: array
                                database_acl:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                database_owner:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                relations:
                                    items:
                                        properties:
                                            acl:
                                                type: string
                                                x-cerberus-label:
                                                    - untrusted
                                            name:
                                                type: string
                                                x-cerberus-label:
                                                    - untrusted
                                            owner:
                                                type: string
                                                x-cerberus-label:
                                                    - untrusted
                                        type: object
                                    type: array
                                schema_acl:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                schema_owner:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                            type: object
                        app:
                            properties:
                                blockers:
                                    items:
                                        type: string
                                        x-cerberus-label:
                                            - untrusted
                                    type: array
                            type: object
                        blockers:
                            items:
                                type: string
                                x-cerberus-label:
                                    - untrusted
                            type: array
                      type: object
                    - type: object
              issued_secrets:
                - migration_password
                - runtime_password
              destructive: true
              supports_dry: true
              requires_ack: true
            - name: rotate_login
              description: Add a new login generation with a host-persisted credential; retain existing generations until consumer cutover.
              input_schema:
                additionalProperties: false
                properties:
                    app:
                        description: Lowercase app slug, max 20 characters.
                        type: string
                    cluster:
                        description: Configured cluster identity; no ad-hoc endpoints.
                        type: string
                    environment:
                        description: Lowercase environment slug, max 12 characters.
                        type: string
                    expected_plan:
                        description: Lifecycle plan_digest from this operation's dry-run; required for execution.
                        type: string
                    issuance_id:
                        description: Fresh 32-character lowercase hex ID; host durably refuses reuse.
                        type: string
                    kind:
                        enum:
                            - runtime
                            - migration
                        type: string
                required:
                    - cluster
                    - app
                    - environment
                    - kind
                    - issuance_id
                type: object
              effect: admin
              target:
                kind: postgres.cluster
                from:
                    - cluster
              preview: plugin
              output: structured
              cost: none
              local_fs: writes
              output_schema:
                oneOf:
                    - properties:
                        adoption_inventory:
                            properties:
                                blockers:
                                    items:
                                        type: string
                                        x-cerberus-label:
                                            - untrusted
                                    type: array
                                database_acl:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                database_owner:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                relations:
                                    items:
                                        properties:
                                            acl:
                                                type: string
                                                x-cerberus-label:
                                                    - untrusted
                                            name:
                                                type: string
                                                x-cerberus-label:
                                                    - untrusted
                                            owner:
                                                type: string
                                                x-cerberus-label:
                                                    - untrusted
                                        type: object
                                    type: array
                                schema_acl:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                schema_owner:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                            type: object
                        app:
                            properties:
                                blockers:
                                    items:
                                        type: string
                                        x-cerberus-label:
                                            - untrusted
                                    type: array
                            type: object
                        blockers:
                            items:
                                type: string
                                x-cerberus-label:
                                    - untrusted
                            type: array
                      type: object
                    - type: object
              issued_secrets:
                - password
              destructive: true
              supports_dry: true
              requires_ack: true
            - name: retire_login
              description: Disable and drain an old login only while a newer generation has a live named consumer connection. Preserves roles and data.
              input_schema:
                additionalProperties: false
                properties:
                    app:
                        description: Lowercase app slug, max 20 characters.
                        type: string
                    cluster:
                        description: Configured cluster identity; no ad-hoc endpoints.
                        type: string
                    consumer:
                        description: Replacement connection application_name proving consumer cutover; lowercase slug, max 48 characters.
                        type: string
                    environment:
                        description: Lowercase environment slug, max 12 characters.
                        type: string
                    expected_plan:
                        description: Lifecycle plan_digest from this operation's dry-run; required for execution.
                        type: string
                    generation:
                        maximum: 999999
                        minimum: 1
                        type: integer
                    kind:
                        enum:
                            - runtime
                            - migration
                        type: string
                required:
                    - cluster
                    - app
                    - environment
                    - consumer
                    - kind
                    - generation
                type: object
              effect: admin
              target:
                kind: postgres.cluster
                from:
                    - cluster
              preview: plugin
              output: structured
              cost: none
              local_fs: none
              output_schema:
                oneOf:
                    - properties:
                        adoption_inventory:
                            properties:
                                blockers:
                                    items:
                                        type: string
                                        x-cerberus-label:
                                            - untrusted
                                    type: array
                                database_acl:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                database_owner:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                relations:
                                    items:
                                        properties:
                                            acl:
                                                type: string
                                                x-cerberus-label:
                                                    - untrusted
                                            name:
                                                type: string
                                                x-cerberus-label:
                                                    - untrusted
                                            owner:
                                                type: string
                                                x-cerberus-label:
                                                    - untrusted
                                        type: object
                                    type: array
                                schema_acl:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                schema_owner:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                            type: object
                        app:
                            properties:
                                blockers:
                                    items:
                                        type: string
                                        x-cerberus-label:
                                            - untrusted
                                    type: array
                            type: object
                        blockers:
                            items:
                                type: string
                                x-cerberus-label:
                                    - untrusted
                            type: array
                      type: object
                    - type: object
              destructive: true
              supports_dry: true
              requires_ack: true
            - name: revoke_login
              description: Emergency disable and drain a managed login without requiring a replacement. Preserves roles and data.
              input_schema:
                additionalProperties: false
                properties:
                    app:
                        description: Lowercase app slug, max 20 characters.
                        type: string
                    cluster:
                        description: Configured cluster identity; no ad-hoc endpoints.
                        type: string
                    environment:
                        description: Lowercase environment slug, max 12 characters.
                        type: string
                    expected_plan:
                        description: Lifecycle plan_digest from this operation's dry-run; required for execution.
                        type: string
                    generation:
                        maximum: 999999
                        minimum: 1
                        type: integer
                    kind:
                        enum:
                            - runtime
                            - migration
                        type: string
                required:
                    - cluster
                    - app
                    - environment
                    - kind
                    - generation
                type: object
              effect: admin
              target:
                kind: postgres.cluster
                from:
                    - cluster
              preview: plugin
              output: structured
              cost: none
              local_fs: none
              output_schema:
                oneOf:
                    - properties:
                        adoption_inventory:
                            properties:
                                blockers:
                                    items:
                                        type: string
                                        x-cerberus-label:
                                            - untrusted
                                    type: array
                                database_acl:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                database_owner:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                relations:
                                    items:
                                        properties:
                                            acl:
                                                type: string
                                                x-cerberus-label:
                                                    - untrusted
                                            name:
                                                type: string
                                                x-cerberus-label:
                                                    - untrusted
                                            owner:
                                                type: string
                                                x-cerberus-label:
                                                    - untrusted
                                        type: object
                                    type: array
                                schema_acl:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                schema_owner:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                            type: object
                        app:
                            properties:
                                blockers:
                                    items:
                                        type: string
                                        x-cerberus-label:
                                            - untrusted
                                    type: array
                            type: object
                        blockers:
                            items:
                                type: string
                                x-cerberus-label:
                                    - untrusted
                            type: array
                      type: object
                    - type: object
              destructive: true
              supports_dry: true
              requires_ack: true
            - name: retire_legacy
              description: Revoke legacy CONNECT and grants only in the adopted database, then drain its sessions there after proving the new runtime consumer. Preserve the legacy role and access to other databases.
              input_schema:
                additionalProperties: false
                properties:
                    app:
                        description: Lowercase app slug, max 20 characters.
                        type: string
                    cluster:
                        description: Configured cluster identity; no ad-hoc endpoints.
                        type: string
                    consumer:
                        description: Live replacement runtime application_name; lowercase slug, max 48 characters.
                        type: string
                    environment:
                        description: Lowercase environment slug, max 12 characters.
                        type: string
                    expected_plan:
                        description: Lifecycle plan_digest from this operation's dry-run; required for execution.
                        type: string
                required:
                    - cluster
                    - app
                    - environment
                    - consumer
                type: object
              effect: admin
              target:
                kind: postgres.cluster
                from:
                    - cluster
              preview: plugin
              output: structured
              cost: none
              local_fs: none
              output_schema:
                oneOf:
                    - properties:
                        adoption_inventory:
                            properties:
                                blockers:
                                    items:
                                        type: string
                                        x-cerberus-label:
                                            - untrusted
                                    type: array
                                database_acl:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                database_owner:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                relations:
                                    items:
                                        properties:
                                            acl:
                                                type: string
                                                x-cerberus-label:
                                                    - untrusted
                                            name:
                                                type: string
                                                x-cerberus-label:
                                                    - untrusted
                                            owner:
                                                type: string
                                                x-cerberus-label:
                                                    - untrusted
                                        type: object
                                    type: array
                                schema_acl:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                                schema_owner:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                            type: object
                        app:
                            properties:
                                blockers:
                                    items:
                                        type: string
                                        x-cerberus-label:
                                            - untrusted
                                    type: array
                            type: object
                        blockers:
                            items:
                                type: string
                                x-cerberus-label:
                                    - untrusted
                            type: array
                      type: object
                    - type: object
              destructive: true
              supports_dry: true
              requires_ack: true
    host:
        min_contract: 1
        max_contract: 1
    surfaces:
        mcp:
            - inspect
            - plan_app
            - provision_app
            - rotate_login
            - retire_login
            - revoke_login
            - adopt_app
            - retire_legacy
