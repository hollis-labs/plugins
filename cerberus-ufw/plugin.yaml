schema_version: "1"
id: ufw
version: 0.1.0
protocol: plugin-sdk/subprocess
runtime: subprocess
entrypoint:
    command: bin/cerberus-ufw-plugin
cerberus:
    connector:
        api_version: cerberus.connector/v1
        kind: Connector
        id: ufw
        version: 0.1.0
        resource_types:
            - ufw.firewall
        capabilities:
            can_create: false
            can_destroy: false
            can_build: false
            can_logs: false
            can_health: false
        operations:
            - name: status
              description: Check UFW firewall status.
              examples:
                - cerberus connectors exec ufw status
              input_schema:
                additionalProperties: false
                properties: {}
                type: object
              effect: read
              target:
                kind: ufw.firewall
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                type: string
            - name: allow
              description: Allow a port in UFW.
              examples:
                - cerberus connectors exec ufw allow --arg port=80/tcp --ack
              input_schema:
                additionalProperties: false
                properties:
                    port:
                        description: Port to allow (e.g., 80/tcp).
                        type: string
                required:
                    - port
                type: object
              effect: write
              reversible: true
              target:
                kind: ufw.firewall
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                type: string
              destructive: true
              requires_ack: true
            - name: deny
              description: Deny a port in UFW.
              examples:
                - cerberus connectors exec ufw deny --arg port=80/tcp --ack
              input_schema:
                additionalProperties: false
                properties:
                    port:
                        description: Port to deny (e.g., 80/tcp).
                        type: string
                required:
                    - port
                type: object
              effect: write
              reversible: true
              target:
                kind: ufw.firewall
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                type: string
              destructive: true
              requires_ack: true
    host:
        min_contract: 1
        max_contract: 1
    surfaces:
        mcp:
            - status
            - allow
            - deny
