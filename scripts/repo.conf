# shellcheck shell=bash disable=SC2034 # the variables are read by the scripts that source this
# Per-repository settings, sourced by the scripts in this directory.
KIND=plugins
REPO_NAME=plugins
# Every plugin is a Go module at <plugin>/go.mod with module path <MODULE_PREFIX>/<plugin>,
# tagged <plugin>/vX.Y.Z, and carries a monorepo-owned descriptor <plugin>/plugin.json.
MODULE_PREFIX=github.com/hollis-labs/plugins
